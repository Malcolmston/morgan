version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofmt
    - misspell
    - godot
    - noctx

linters-settings:
  errcheck:
    check-blank: true
  godot:
    scope: declarations

issues:
  exclude-rules:
    # Test files don't need godot on every comment
    - path: _test\.go
      linters: [godot, errcheck]
