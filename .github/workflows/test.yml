name: Test

on:
  pull_request:
    branches: ["main"]
  workflow_call:
    outputs:
      coverage-artifact:
        description: Name of the uploaded coverage artifact
        value: ${{ jobs.test.outputs.coverage-artifact }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      coverage-artifact: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/Malcolmston/morgan ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
