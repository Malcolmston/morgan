name: Publish

on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  lint:
    uses: ./.github/workflows/lint.yml

  publish:
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Publish to pkg.go.dev via proxy
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Request the version info endpoint on proxy.golang.org.
          # This is the canonical way to add a package to pkg.go.dev per
          # https://pkg.go.dev/about#adding-a-package — the proxy indexes
          # the module and pkg.go.dev picks it up from the module index.
          # Note: uppercase letters in module paths are escaped as !lowercase.
          curl -sfL \
            "https://proxy.golang.org/github.com/!malcolmston/morgan/@v/${VERSION}.info" \
            -o /dev/null

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
