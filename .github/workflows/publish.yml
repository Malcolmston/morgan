name: Publish

on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  lint:
    uses: ./.github/workflows/lint.yml

  publish:
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Trigger Go module proxy indexing
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The proxy escapes uppercase letters as !lowercase
          GOPROXY=https://proxy.golang.org GONOSUMDB=* \
            go list -m github.com/Malcolmston/morgan@${VERSION}

      - name: Trigger pkg.go.dev fetch
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          curl -sf "https://pkg.go.dev/github.com/Malcolmston/morgan@${VERSION}" \
            -o /dev/null || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
